<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking History</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet"  type="text/css" th:href="@{/css/style.css}">
  <link rel="stylesheet"  type="text/css" href="./css/style.css">
</head>
<body th:style="'background: linear-gradient( rgb(0 14 38  / 70%), rgba(52, 210, 102, 0.3)),
                url('+ @{/images/bgImage.jpg }+') no-repeat center center/cover; background-attachment:fixed;'">

<div class="container-fluid">
  <nav class="navbar navbar-expand-lg navbar-light">
    <a class="navbar-brand text-light" href="#">Smart Parking Booking</a>
    <button class="navbar-toggler text-light bg-light bg-gradient" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item active">
          <a class="nav-link text-light" href="@{/}"><i class="fas fa-home"></i> HOME</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-light" href="@{/bookingHistory}"><i class="fas fa-history"></i> BOOKING HISTORY</a>
        </li>
      </ul>
    </div>
  </nav>
</div>

<div class="container bg-light mt-5 p-4" style="border-radius:5px;">
  <h2 class="text-center">Booking History</h2>
  <form th:action="@{/bookingHistory/booking-history}" method="post" class="mt-4">
    <div class="form-row">
      <div class="form-group col-md-6">
        <label for="userID">User ID</label>
        <input type="text" id="userID" name="userID" class="form-control" placeholder="Enter User ID" required>
      </div>
      <div class="form-group col-md-6">
        <label for="mobileNumber">Mobile Number</label>
        <input type="text" id="mobileNumber" name="mobileNumber" class="form-control" placeholder="Enter Mobile Number" required>
      </div>
    </div>
    <button type="submit" class="btn btn-primary btn-block">View Booking History</button>
  </form>

  <div th:if="${bookings}" class="mt-5">
    <h3 class="text-center">Your Booking Details</h3>
    <table class="table table-bordered table-hover mt-3">
      <thead class="thead-dark">
      <tr>
        <th>Booking ID</th>
        <th>User ID</th>
        <th>Start Time</th>
        <th>Duration</th>
        <th>Status</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="booking : ${bookings}">
        <td th:text="${booking.bookingId}"></td>
        <td th:text="${booking.userID}"></td>
        <td th:text="${#dates.format(booking.startTime, 'yyyy-MM-dd HH:mm')}"></td>
        <td th:text="${booking.duration} + ' hrs'"></td>
        <td th:text="${booking.bookingSpotStatus}"></td>
      </tr>
      </tbody>
    </table>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
